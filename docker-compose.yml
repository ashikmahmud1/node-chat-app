# Local development with S3-compatible attachment storage.
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: ["mini", "-dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-webdav=false", "-admin.ui=false", "-s3.autoCreateBucket=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID for local SeaweedFS}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY for local SeaweedFS}
      S3_BUCKET: ${AWS_S3_BUCKET_NAME:-chat-app-uploads}
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 3s
      retries: 15

  chat-app:
    build: .
    init: true
    restart: on-failure
    depends_on:
      seaweedfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:40000-40100:40000-40100/udp"
    environment:
      NODE_ENV: development
      PUBLIC_ORIGIN: http://localhost:3000
      STORAGE_TYPE: s3
      AWS_ENDPOINT_URL_S3: http://seaweedfs:8333
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID for local SeaweedFS}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY for local SeaweedFS}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-chat-app-uploads}
      RTC_ADVERTISED_ADDRESS: 127.0.0.1
    volumes:
      - chat_data:/usr/src/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  seaweedfs_data:
  chat_data:
