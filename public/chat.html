<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <title>Chat | ChatApp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/animate.css" type="text/css" />
</head>

<body class="chat">
<audio id="message-received" autoplay></audio>
<aside class="chat__sidebar" id="chat__sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand__icon">
            <i class="fa fa-comments" aria-hidden="true"></i>
        </div>
        <div class="sidebar-brand__info">
            <h2>NexusChat</h2>
            <span class="sidebar-room-badge" id="sidebar-room-name">Room</span>
        </div>
    </div>

    <div class="sidebar-presence-box">
        <label for="presence-status-select">Status</label>
        <select id="presence-status-select" class="presence-select">
            <option value="online">● Online</option>
            <option value="away">● Away</option>
            <option value="dnd">● Do Not Disturb</option>
        </select>
    </div>

    <div class="sidebar-section-header">
        <h3>People</h3>
        <span class="online-count-badge" id="online-count">0</span>
    </div>
    <div id="users" class="sidebar-users-list"></div>

    <div class="sidebar-footer">
        <a href="/" class="leave-room-btn">
            <i class="fa fa-sign-out" aria-hidden="true"></i> Switch Room
        </a>
    </div>
</aside>

<div class="chat__main">
    <header class="chat__header">
        <div class="chat__header-left">
            <button type="button" id="show-people" class="mobile-sidebar-btn" title="Toggle People Sidebar">
                <i class="fa fa-bars" aria-hidden="true" id="change-arrow"></i>
            </button>
            <div class="room-header-meta">
                <h4 id="header-room-title"># General</h4>
                <span class="room-status-dot"></span>
                <span id="room-call-active-badge" class="room-call-badge hide-element">
                    <i class="fa fa-podcast" aria-hidden="true"></i> <span id="room-call-count">0</span> in SFU Call
                </span>
            </div>
        </div>

        <div class="chat__header-actions">
            <input type="search" id="room-message-search" class="header-search-input" placeholder="Search messages..." autocomplete="off" />
            <button type="button" id="join-room-audio-btn" class="btn-header-call btn-header-audio" title="Start or Join Room SFU Audio Call">
                <i class="fa fa-phone" aria-hidden="true"></i> <span>Room Audio</span>
            </button>
            <button type="button" id="join-room-video-btn" class="btn-header-call btn-header-video" title="Start or Join Room SFU Video Conference">
                <i class="fa fa-video-camera" aria-hidden="true"></i> <span>Room Video</span>
            </button>
        </div>
    </header>

    <div class="alert alert-success animated slideInDown text-center alert-display alert-hide" id="alert-box"> <i class="fa fa-bell" aria-hidden="true"></i> <span class="alert-text"></span></div>

    <section id="room-call-stage" class="room-call-stage hide-element">
        <div class="room-call-stage__header">
            <div class="room-call-stage__title">
                <span class="live-indicator">LIVE SFU</span>
                <span id="room-call-mode-label">Room Conference</span>
                <span id="room-call-timer" class="call-timer-pill">00:00</span>
            </div>
            <div class="room-call-stage__controls">
                <button type="button" id="room-toggle-mic" class="sfu-ctrl-btn" title="Mute / Unmute Microphone">
                    <i class="fa fa-microphone" aria-hidden="true"></i>
                </button>
                <button type="button" id="room-toggle-cam" class="sfu-ctrl-btn" title="Turn Camera On / Off">
                    <i class="fa fa-video-camera" aria-hidden="true"></i>
                </button>
                <button type="button" id="room-toggle-screen" class="sfu-ctrl-btn" title="Share Screen">
                    <i class="fa fa-desktop" aria-hidden="true"></i>
                </button>
                <button type="button" id="room-leave-call" class="sfu-ctrl-btn sfu-ctrl-danger" title="Leave Room Conference">
                    <i class="fa fa-phone" aria-hidden="true"></i> Leave
                </button>
            </div>
        </div>
        <div id="room-video-grid" class="room-video-grid"></div>
    </section>

    <!-- Modal -->
    <div id="myModal" class="modal fade" role="dialog">
        <div class="modal-dialog modal-lg">
            <!-- Modal content-->
            <div class="modal-content modern-modal">
                <div class="modal-header modern-modal__header">
                    <div class="modern-modal__user">
                        <span class="private-user-avatar"><i class="fa fa-user" aria-hidden="true"></i></span>
                        <div>
                            <h4 class="modal-title">Private Chat</h4>
                            <span class="private-sfu-badge">Direct Message &amp; WebRTC SFU</span>
                        </div>
                    </div>
                    <button type="button" id="audio-call-start" class="hide-call-button"></button>
                    <button type="button" id="video-call-start" class="hide-call-button"></button>
                    <div class="modern-modal__actions">
                        <button type="button" id="audio-call" class="btn btn-call-action" title="1-to-1 SFU Audio Call"><i class="fa fa-phone" aria-hidden="true"></i></button>
                        <button type="button" id="video-call" class="btn btn-call-action" title="1-to-1 SFU Video Call"><i class="fa fa-video-camera" aria-hidden="true"></i></button>
                        <button type="button" class="close modern-modal__close" data-dismiss="modal">&times;</button>
                    </div>
                </div>
                <div class="modal-body modern-modal__body">
                    <div class="private-video-stage">
                        <video id="other-video" class="other-video" autoplay playsinline></video>
                        <video id="self-video" class="self-video" muted autoplay playsinline></video>
                    </div>
                    <div class="call-section calling end-call" id="call-section">
                        <div class="text-center">
                            <h3 id="show-call-text">SFU Audio Calling....</h3>
                            <h3 id="show-time" class="hide-time">00:00</h3>
                            <div class="private-call-controls">
                                <button type="button" class="btn btn-default btn-sm" id="private-toggle-mic-audio" title="Mute / Unmute"><i class="fa fa-microphone" aria-hidden="true"></i></button>
                                <button type="button" class="btn btn-danger" id="end-call">End Call</button>
                            </div>
                        </div>
                    </div>
                    <div class="call-section calling end-video-call" id="video-call-section">
                        <div class="text-center">
                            <h3>SFU Video Calling....</h3>
                            <div class="private-call-controls">
                                <button type="button" class="btn btn-default btn-sm" id="private-toggle-mic-video" title="Mute / Unmute"><i class="fa fa-microphone" aria-hidden="true"></i></button>
                                <button type="button" class="btn btn-default btn-sm" id="private-toggle-cam-video" title="Toggle Camera"><i class="fa fa-video-camera" aria-hidden="true"></i></button>
                                <button type="button" class="btn btn-danger" id="end-video-call">End Call</button>
                            </div>
                        </div>
                    </div>
                    <div class="call-section accept-reject-call" id="call-receive-section">
                        <div class="text-center">
                            <div class="text-center animated flash infinite incoming-call-title" id="audio-calling-text"></div>
                            <div class="incoming-call-buttons">
                                <button class="btn btn-primary accept-call" id="accept-call">Accept</button>
                                <button class="btn btn-danger reject-call" id="reject-call">Reject</button>
                            </div>
                        </div>
                    </div>
                    <div class="call-section accept-reject-video-call" id="video-call-receive-section">
                        <div class="text-center">
                            <div class="text-center animated flash infinite incoming-call-title" id="video-calling-text"></div>
                            <div class="incoming-call-buttons">
                                <button class="btn btn-primary accept-video-call" id="accept-video-call">Accept</button>
                                <button class="btn btn-danger reject-video-call" id="reject-video-call">Reject</button>
                            </div>
                        </div>
                    </div>
                    <ol id="private_messages_list" class="chat__messages"></ol>
                    <div id="private-typing-indicator" class="typing-indicator hide-element"></div>
                    <div class="progress private-progress-hide" id="private-upload-progress-bar">
                        <div class="progress-bar progress-bar-striped active" id="private-upload-progress-bar-inner" role="progressbar"
                             aria-valuenow="10" aria-valuemin="0" aria-valuemax="100">
                            0%
                        </div>
                    </div>
                    <audio id="audioCalling" autoplay></audio>
                </div>
                <div class="modal-footer modern-modal__footer">
                    <div class="chat__footer">
                        <form id="private-message-form">
                            <input name="private-message" type="text" placeholder="Write a private message..." autofocus autocomplete="off" required/>
                            <button class="private-message-send">Send</button>
                        </form>
                        <button id="private-send-location" class="btn-composer-secondary"><i class="fa fa-map-marker" aria-hidden="true"></i> <span>Send location</span></button>
                        <input type="file" id="private-send-file"  style="display: none" accept="*/*">
                        <button type="button" id="private-send-file-click" class="btn-composer-secondary" onclick="upload_private_file()"><i class="fa fa-paperclip" aria-hidden="true"></i> <span>Send File</span></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <ol id="messages" class="chat__messages"></ol>
    <div id="room-typing-indicator" class="typing-indicator hide-element"></div>
    <div class="progress progress-hide" id="upload-progress-bar">
        <div class="progress-bar progress-bar-striped active" role="progressbar" id="upload-progress-bar-inner"
             aria-valuenow="10" aria-valuemin="0" aria-valuemax="100">
            0%
        </div>
    </div>
    <div class="chat__footer">
        <form id="message-form">
            <input name="message" type="text" placeholder="Write a message to the room..." autofocus autocomplete="off"/>
            <button>Send</button>
        </form>
        <div class="composer-actions">
            <button id="send-location" class="btn-composer-secondary"><i class="fa fa-map-marker" aria-hidden="true"></i> <span>Send location</span></button>
            <input type="file" id="input-file" style="display: none" accept="*/*">
            <button type="button" id="send-file" class="btn-composer-secondary" onclick="upload_file()"><i class="fa fa-paperclip" aria-hidden="true"></i> <span>Send File</span></button>
        </div>
    </div>
</div>
<script id="private-message-template" type="text/template">
    <li class="message">
        <div class="message__title">
            <h4>{{from}}</h4>
            <span class="user-time">{{createdAt}}</span>
        </div>
        <div class="message__body">
            <p>{{text}}</p>
        </div>
    </li>
</script>
<script id="message-template" type="text/template">
    <li class="message">
        <div class="message__title">
            <h4>{{from}}</h4>
            <span class="user-time">{{createdAt}}</span>
        </div>
        <div class="message__body">
            <p>{{text}}</p>
        </div>
    </li>
</script>

<script id="location-message-template" type="text/template">
    <li class="message">
        <div class="message__title">
            <h4>{{from}}</h4>
            <span class="user-time">{{createdAt}}</span>
        </div>
        <div class="message__body">
            <p>
                <a href="{{url}}" target="_blank" class="message-chip-link"><i class="fa fa-map-marker" aria-hidden="true"></i> My current location</a>
            </p>
        </div>
    </li>
</script>
<script id="file-message-template" type="text/template">
    <li class="message">
        <div class="message__title">
            <h4>{{from}}</h4>
            <span class="user-time">{{createdAt}}</span>
        </div>
        <div class="message__body">
            <p>
                <a href="/data/{{url}}" target="_blank" class="message-chip-link"><i class="fa fa-file-o" aria-hidden="true"></i> {{url}}</a>
            </p>
        </div>
    </li>
</script>

<script src="/socket.io/socket.io.js"></script>
<!-- jQuery library -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

<!-- Latest compiled JavaScript -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
<script src="/js/libs/moment.js"></script>
<script src="/js/libs/mustache.js"></script>
<script src="/js/libs/deparam.js"></script>
<script src="/js/chat.js"></script>

</body>

</html>
