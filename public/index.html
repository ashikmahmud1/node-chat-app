<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Join Workspace | NexusChat SFU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="centered-form">
  <div class="centered-form__form">
    <form action="/chat.html" id="join-form">
      <div class="brand-header">
        <div class="brand-logo">
          <i class="fa fa-comments" aria-hidden="true"></i>
        </div>
        <h3>NexusChat</h3>
        <p class="brand-subtitle">Real-time Messaging &amp; WebRTC SFU Conferencing</p>
      </div>
      <div class="form-field">
        <label for="name-input"><i class="fa fa-user-o" aria-hidden="true"></i> Display Name</label>
        <input id="name-input" type="text" name="name" maxlength="50" placeholder="e.g. Ashik" autofocus required autocomplete="off" />
      </div>
      <div class="form-field">
        <label for="room-input"><i class="fa fa-hashtag" aria-hidden="true"></i> Room / Channel</label>
        <input id="room-input" type="text" name="room" list="active-rooms" maxlength="50" placeholder="e.g. Engineering" required autocomplete="off" />
        <datalist id="active-rooms"></datalist>
        <div id="active-rooms-pills" class="active-rooms-pills"></div>
      </div>
      <div class="form-field">
        <button type="submit" class="btn-join-primary">
          <span>Join Room</span>
          <i class="fa fa-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
    </form>
  </div>

  <script>
    (function () {
      var form = document.getElementById('join-form');
      var nameInput = document.getElementById('name-input');
      var roomInput = document.getElementById('room-input');
      var datalist = document.getElementById('active-rooms');
      var pillsContainer = document.getElementById('active-rooms-pills');

      if (window.fetch && datalist) {
        fetch('/api/rooms')
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data && Array.isArray(data.rooms) && data.rooms.length > 0) {
              var label = document.createElement('span');
              label.className = 'pills-label';
              label.textContent = 'Active rooms:';
              pillsContainer.appendChild(label);

              data.rooms.forEach(function (room) {
                var option = document.createElement('option');
                option.value = room;
                datalist.appendChild(option);

                var pill = document.createElement('button');
                pill.type = 'button';
                pill.className = 'room-pill';
                pill.textContent = '# ' + room;
                pill.addEventListener('click', function () {
                  roomInput.value = room;
                  roomInput.focus();
                });
                pillsContainer.appendChild(pill);
              });
            }
          })
          .catch(function () {});
      }

      if (form) {
        form.addEventListener('submit', function (e) {
          nameInput.value = nameInput.value.trim();
          roomInput.value = roomInput.value.trim();
          if (!nameInput.value || !roomInput.value) {
            e.preventDefault();
            alert('Please enter a valid display name and room name.');
          }
        });
      }
    })();
  </script>
</body>

</html>
