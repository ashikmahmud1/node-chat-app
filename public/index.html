<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Join Group | NexusChat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
  <link rel="stylesheet" href="/assets/icons/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="centered-form">
  <div class="centered-form__form">
    <form action="/chat.html" method="post" id="join-form">
      <div class="brand-header">
        <div class="brand-logo">
          <i class="fa-solid fa-comments" aria-hidden="true"></i>
        </div>
        <h3>NexusChat</h3>
        <p class="brand-subtitle">Group chat, direct messages, and calls</p>
      </div>
      <div class="form-field">
        <label for="name-input"><i class="fa-regular fa-user" aria-hidden="true"></i> Display Name</label>
        <input id="name-input" type="text" name="name" maxlength="50" placeholder="e.g. Alex" autofocus required autocomplete="off" />
      </div>
      <div class="form-field">
        <label for="room-input"><i class="fa-solid fa-hashtag" aria-hidden="true"></i> Group / Channel</label>
        <input id="room-input" type="text" name="room" list="active-rooms" maxlength="50" placeholder="e.g. Engineering" required autocomplete="off" />
        <datalist id="active-rooms"></datalist>
        <p class="group-visibility">Anyone can join a group by name.</p>
        <div id="active-rooms-pills" class="active-rooms-pills"></div>
      </div>
      <p id="join-status" class="join-status" role="status"></p>
      <div class="form-field">
        <button type="submit" class="btn-join-primary">
          <span>Join Group</span>
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
    </form>
  </div>

  <script src="/js/join.js" defer></script>
</body>
</html>
