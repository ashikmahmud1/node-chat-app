listening-ip=0.0.0.0
tls-listening-port=5349
no-udp
no-tcp
no-dtls
no-tlsv1
no-tlsv1_1
min-port=49160
max-port=49259
use-auth-secret
cert=/etc/nexus/tls/fullchain.pem
pkey=/etc/nexus/tls/privkey.pem
no-cli
no-multicast-peers
no-tcp-relay
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
total-quota=80
user-quota=8
userdb=/tmp/turn.sqlite
pidfile=/tmp/turn.pid
log-file=stdout
simple-log
